name: lifeos_app
description: LifeOS – lokaler Lebensplaner für Windows, Android und iOS.
version: 0.5.0+5
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_riverpod: ^3.4.0
  go_router: ^18.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  timezone: ^0.11.0
  lifeos_calendar:
    path: ../../packages/features/calendar
  lifeos_core:
    path: ../../packages/core
  lifeos_daily_report:
    path: ../../packages/features/daily_report
  lifeos_design_system:
    path: ../../packages/design_system
  lifeos_finance:
    path: ../../packages/features/finance
  lifeos_habits:
    path: ../../packages/features/habits
  lifeos_kitchen:
    path: ../../packages/features/kitchen
  lifeos_notes:
    path: ../../packages/features/notes
  lifeos_persistence:
    path: ../../packages/persistence
  lifeos_projects:
    path: ../../packages/features/projects
  lifeos_security:
    path: ../../packages/security
  lifeos_sync:
    path: ../../packages/sync
  lifeos_tags:
    path: ../../packages/features/tags
  lifeos_tasks:
    path: ../../packages/features/tasks

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
