name: lifeos_app
description: LifeOS – lokaler Lebensplaner für Windows, Android und iOS.
version: 0.2.0+2
publish_to: none
resolution: workspace

environment:
  sdk: ^3.9.0
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.0
  go_router: ^18.1.0
  path: ^1.9.0
  path_provider: ^2.1.5
  lifeos_core:
    path: ../../packages/core
  lifeos_design_system:
    path: ../../packages/design_system
  lifeos_notes:
    path: ../../packages/features/notes
  lifeos_persistence:
    path: ../../packages/persistence
  lifeos_security:
    path: ../../packages/security
  lifeos_sync:
    path: ../../packages/sync
  lifeos_tasks:
    path: ../../packages/features/tasks

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
